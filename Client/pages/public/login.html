<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Voice of Law</title>
  <meta name="description" content="Login to Voice of Law — Pakistan's First Legal AI Assistant">
  <script src="https://cdn.tailwindcss.com"></script>\n<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            vol: {
              main: '#13141f',
              sidebar: '#1a1b26',
              card: '#1f2029',
              hover: '#2a2b36',
              border: '#2f303d',
              gold: '#d4af37',
              goldHover: '#f2c94c',
              goldDark: '#a18321',
              text: '#f3f4f6',
              textMuted: '#9ca3af'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/custom.css">
  <style>
    .accent { color: #8b7355; }
    .accent-bg { background-color: #8b7355; }
    .accent-border { border-color: #8b7355; }
    .accent-ring:focus { --tw-ring-color: #8b7355; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-50 to-white flex items-center justify-center p-4 font-sans">
  <div class="w-full max-w-md">
    <!-- Main Card -->
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <!-- Logo -->
      <div class="flex flex-col items-center mb-8">
        <a href="/">
          <div class="w-24 h-24 rounded-2xl bg-gradient-to-br from-gray-800 to-gray-900 flex items-center justify-center mb-3">
            <svg class="w-14 h-14 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg>
          </div>
        </a>
        <h1 class="text-2xl font-bold mb-1" style="color:#2c2c2c">Voice of Law</h1>
        <p class="text-sm text-gray-600">Your Most Trusted Legal Assistant</p>
      </div>

      <!-- Subtitle -->
      <div class="text-center mb-6">
        <p class="text-xs text-gray-500">Pakistan First Legal Marketplace & AI-powered Legal Assistance</p>
      </div>

      <!-- Error -->
      <div id="errorBox" class="hidden bg-red-50 text-red-700 p-4 rounded-lg mb-6 border-l-4 border-red-700 text-sm"></div>

      <!-- Form -->
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
          <input type="email" name="email" required placeholder="Enter your email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 text-sm" style="--tw-ring-color:#8b7355">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
          <div class="relative">
            <input type="password" name="password" id="passwordInput" required placeholder="Enter your password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 text-sm pr-12" style="--tw-ring-color:#8b7355">
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="w-4 h-4 border-gray-300 rounded" style="accent-color:#8b7355">
            <span class="text-sm text-gray-700">Remember me</span>
          </label>
          <a href="/forgot-password" class="text-sm font-medium accent">Forgot Password?</a>
        </div>

        <button type="submit" id="submitBtn" class="w-full py-3 text-white rounded-lg font-medium transition text-sm hover:opacity-90" style="background-color:#2c2c2c">
          Login to your account
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-300"></div></div>
        <div class="relative flex justify-center text-sm"><span class="px-4 bg-white text-gray-500">Or continue with</span></div>
      </div>

      <!-- Google -->
      <button id="googleBtn" class="w-full py-3 border border-gray-300 rounded-lg font-medium hover:bg-gray-50 transition flex items-center justify-center gap-3 text-sm text-gray-700">
        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>

      <!-- Switch -->
      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">Don't have an account? <a href="/register" class="font-medium accent">Create New Account</a></p>
      </div>

      <!-- Legal -->
      <div class="mt-6 text-center">
        <p class="text-xs text-gray-500">By continuing, you agree to our <a href="#" class="accent">Terms of Service</a> and <a href="#" class="accent">Privacy Policy</a></p>
      </div>
    </div>

    <div class="mt-6 text-center">
      <a href="/" class="text-sm text-gray-600 hover:text-gray-900 flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg>
        voiceoflaw.com
      </a>
    </div>
  </div>

  <script src="/js/utils/api.js"></script>
  <script src="/js/utils/auth.js"></script>
  <script src="/js/components/toast.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) window.location.href = '/dashboard';

    function togglePassword() {
      const input = document.getElementById('passwordInput');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      errorBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<div class="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin mx-auto"></div>';

      try {
        const fd = new FormData(e.target);
        const res = await api.post('/auth/login', { email: fd.get('email'), password: fd.get('password') });
        Auth.setAuth(res.token, res.user);

        if (res.user.role === 'admin') {
          window.location.href = '/admin';
        } else {
          window.location.href = '/dashboard';
        }
      } catch (error) {
        errorBox.textContent = error.message || 'Login failed. Please try again.';
        errorBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Login to your account';
      }
    });

    // Google login placeholder
    document.getElementById('googleBtn').addEventListener('click', () => {
      Toast.info('Google login — configure Google Client ID in settings');
    });
  </script>
</body>
</html>
