<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Legal Assistant — Voice of Law</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/custom.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            vol: {
              main: '#13141f',
              sidebar: '#1a1b26',
              card: '#1f2029',
              hover: '#2a2b36',
              border: '#2f303d',
              gold: '#d4af37',
              goldHover: '#f2c94c',
              goldDark: '#a18321',
              text: '#f3f4f6',
              textMuted: '#9ca3af'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 font-sans">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="top-bar md:hidden">
    <button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-100"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <span class="text-sm font-bold">AI Assistant</span><div></div>
  </div>
  <div class="panel-layout">
    <aside class="panel-sidebar" id="sidebar"></aside>
    <main class="panel-main">
      <div class="flex h-screen" style="margin-left:0">
        <!-- Conversation List (Desktop) -->
        <div class="hidden md:flex flex-col w-72 bg-white border-r border-gray-200">
          <div class="p-4 border-b border-gray-100">
            <button onclick="newConversation()" class="btn btn-primary w-full text-sm">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
              New Conversation
            </button>
          </div>
          <div id="conversationList" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
        </div>

        <!-- Chat Area -->
        <div class="flex-1 flex flex-col">
          <!-- Chat Header -->
          <div class="flex items-center justify-between px-6 py-3 bg-white border-b border-gray-200">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5"/></svg>
              </div>
              <div>
                <h2 class="text-sm font-semibold text-gray-900">AI Legal Assistant</h2>
                <p class="text-xs text-emerald-500">● Online — Pakistani Law Expert</p>
              </div>
            </div>
          </div>

          <!-- Messages -->
          <div class="chat-messages" id="chatMessages">
            <div class="flex justify-center my-8">
              <div class="text-center max-w-md">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center mx-auto mb-4">
                  <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg>
                </div>
                <h3 class="text-lg font-bold text-gray-900 mb-2">Welcome to AI Legal Assistant</h3>
                <p class="text-sm text-gray-500 mb-4">Ask me anything about Pakistani law — I can help with PPC, CPC, CrPC, Family Law, Constitutional Law, and more.</p>
                <div class="flex flex-wrap justify-center gap-2">
                  <button onclick="sendQuickQuestion('What are the grounds for bail under CrPC?')" class="text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg hover:bg-indigo-100 transition">Bail Grounds</button>
                  <button onclick="sendQuickQuestion('Explain Section 302 PPC')" class="text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg hover:bg-indigo-100 transition">PPC 302</button>
                  <button onclick="sendQuickQuestion('What is the procedure for filing a civil suit?')" class="text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg hover:bg-indigo-100 transition">Civil Suit Procedure</button>
                  <button onclick="sendQuickQuestion('Explain Khula procedure in Pakistan')" class="text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg hover:bg-indigo-100 transition">Khula Process</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Input Area -->
          <div class="chat-input-area">
            <form id="chatForm" class="flex items-center gap-3">
              <input type="text" id="chatInput" class="form-input flex-1" placeholder="Type your legal question..." autocomplete="off">
              <button type="submit" class="btn btn-primary" id="sendBtn">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/utils/api.js"></script>
  <script src="/js/utils/auth.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script>
    if (!Auth.requireAuth()) throw new Error();
    Sidebar.render('sidebar', 'ai-assistant');
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('show'); }

    let currentConversationId = null;

    function addMessage(role, content) {
      const welcome = document.querySelector('#chatMessages > .flex.justify-center');
      if (welcome) welcome.remove();

      const div = document.createElement('div');
      div.className = `chat-bubble chat-${role} animate-fadeInUp`;
      
      // Simple markdown-to-html
      let html = content
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/^### (.*$)/gm, '<h4 class="font-semibold mt-3 mb-1">$1</h4>')
        .replace(/^## (.*$)/gm, '<h3 class="font-semibold text-base mt-3 mb-1">$1</h3>')
        .replace(/^- (.*$)/gm, '<li class="ml-4">• $1</li>')
        .replace(/^\d+\. (.*$)/gm, '<li class="ml-4">$1</li>')
        .replace(/\n/g, '<br>');
      
      div.innerHTML = html;
      document.getElementById('chatMessages').appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }

    function showTyping() {
      const div = document.createElement('div');
      div.id = 'typing-indicator';
      div.className = 'chat-bubble chat-assistant animate-fadeIn';
      div.innerHTML = '<div class="flex items-center gap-1"><div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:0ms"></div><div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:150ms"></div><div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:300ms"></div></div>';
      document.getElementById('chatMessages').appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }

    function hideTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    async function sendMessage(message) {
      if (!message.trim()) return;
      addMessage('user', message);
      document.getElementById('chatInput').value = '';
      document.getElementById('sendBtn').disabled = true;
      showTyping();

      try {
        const res = await api.post('/ai/chat', { message, conversationId: currentConversationId });
        hideTyping();
        addMessage('assistant', res.response);
        currentConversationId = res.conversationId;

        if (res.sources && res.sources.length) {
          const srcDiv = document.createElement('div');
          srcDiv.className = 'text-xs text-gray-400 ml-4 mb-3';
          srcDiv.innerHTML = '📚 References: ' + res.sources.join(', ');
          document.getElementById('chatMessages').appendChild(srcDiv);
        }

        loadConversations();
      } catch (error) {
        hideTyping();
        Toast.error(error.message || 'Failed to get response');
      }
      document.getElementById('sendBtn').disabled = false;
    }

    function sendQuickQuestion(q) { sendMessage(q); }

    document.getElementById('chatForm').addEventListener('submit', (e) => {
      e.preventDefault();
      sendMessage(document.getElementById('chatInput').value);
    });

    function newConversation() {
      currentConversationId = null;
      document.getElementById('chatMessages').innerHTML = `
        <div class="flex justify-center my-8"><div class="text-center max-w-md">
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg></div>
          <h3 class="text-lg font-bold text-gray-900 mb-2">New Conversation</h3>
          <p class="text-sm text-gray-500">Ask me anything about Pakistani law.</p>
        </div></div>`;
    }

    async function loadConversations() {
      try {
        const res = await api.get('/ai/conversations?limit=20');
        const list = document.getElementById('conversationList');
        if (!list) return;
        list.innerHTML = (res.data || []).map(c => `
          <button onclick="loadConversation('${c._id}')" class="w-full text-left px-3 py-2.5 rounded-lg text-sm hover:bg-gray-50 transition-colors ${c._id === currentConversationId ? 'bg-indigo-50 text-indigo-700' : 'text-gray-700'}">
            <p class="font-medium truncate">${c.title}</p>
            <p class="text-xs text-gray-400 mt-0.5">${c.messageCount || 0} messages</p>
          </button>`).join('') || '<p class="text-center text-xs text-gray-400 py-4">No conversations yet</p>';
      } catch (e) { /* silent */ }
    }

    async function loadConversation(id) {
      try {
        const res = await api.get(`/ai/conversations/${id}`);
        currentConversationId = id;
        document.getElementById('chatMessages').innerHTML = '';
        (res.conversation.messages || []).forEach(m => addMessage(m.role, m.content));
        loadConversations();
      } catch (e) { Toast.error('Failed to load conversation'); }
    }

    loadConversations();
  </script>
</body>
</html>
