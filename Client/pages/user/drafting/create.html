<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Draft — Voice of Law</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/custom.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            vol: {
              main: '#13141f',
              sidebar: '#1a1b26',
              card: '#1f2029',
              hover: '#2a2b36',
              border: '#2f303d',
              gold: '#d4af37',
              goldHover: '#f2c94c',
              goldDark: '#a18321',
              text: '#f3f4f6',
              textMuted: '#9ca3af'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 font-sans">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="top-bar md:hidden"><button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-100"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button><span class="text-sm font-bold">New Draft</span><div></div></div>
  <div class="panel-layout">
    <aside class="panel-sidebar" id="sidebar"></aside>
    <main class="panel-main">
      <div class="top-bar hidden md:flex"><div><h1 class="text-lg font-bold text-gray-900">Create Legal Draft</h1><p class="text-sm text-gray-500">Write or generate a legal document</p></div><a href="/drafting" class="btn btn-secondary btn-sm">← Back</a></div>
      <div class="panel-content">
        <form id="draftForm" class="space-y-6">
          <div class="card card-padded animate-fadeInUp">
            <h2 class="text-sm font-semibold text-gray-900 mb-4">📝 Draft Details</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="form-group"><label class="form-label">Title *</label><input name="title" class="form-input" required placeholder="e.g. Bail Application — Case 123"></div>
              <div class="form-group"><label class="form-label">Draft Type *</label><select name="draftType" class="form-input" required><option value="">Select Type</option><option value="petition">Petition</option><option value="affidavit">Affidavit</option><option value="bail">Bail Application</option><option value="appeal">Appeal</option><option value="contract">Contract</option><option value="notice">Notice</option><option value="other">Other</option></select></div>
            </div>
          </div>

          <div class="card card-padded animate-fadeInUp" style="animation-delay:.1s">
            <h2 class="text-sm font-semibold text-gray-900 mb-4">📄 Content</h2>
            <div class="form-group">
              <textarea name="content" class="form-input font-mono text-sm" rows="20" required placeholder="Write your legal draft content here...&#10;&#10;You can use basic HTML for formatting: &lt;b&gt;bold&lt;/b&gt;, &lt;i&gt;italic&lt;/i&gt;, &lt;u&gt;underline&lt;/u&gt;, &lt;br&gt; for line breaks."></textarea>
            </div>
          </div>

          <div class="flex items-center justify-end gap-3">
            <a href="/drafting" class="btn btn-secondary">Cancel</a>
            <button type="submit" name="action" value="draft" class="btn btn-secondary">Save as Draft</button>
            <button type="submit" name="action" value="completed" class="btn btn-primary">Save & Complete</button>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script src="/js/utils/api.js"></script>
  <script src="/js/utils/auth.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script>
    if (!Auth.requireAuth()) throw new Error();
    Sidebar.render('sidebar', 'legal-drafting');
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('show'); }

    document.getElementById('draftForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const status = e.submitter?.value || 'draft';
      const data = { title: fd.get('title'), draftType: fd.get('draftType'), content: fd.get('content'), status };

      try {
        await api.post('/drafts', data);
        Toast.success('Draft saved!');
        setTimeout(() => window.location.href = '/drafting', 1000);
      } catch (err) { Toast.error(err.message); }
    });
  </script>
</body>
</html>
