<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Voice of Law</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/custom.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            vol: {
              main: '#13141f',
              sidebar: '#1a1b26',
              card: '#1f2029',
              hover: '#2a2b36',
              border: '#2f303d',
              gold: '#d4af37',
              goldHover: '#f2c94c',
              goldDark: '#a18321',
              text: '#f3f4f6',
              textMuted: '#9ca3af'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 font-sans">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="top-bar md:hidden"><button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-100"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button><span class="text-sm font-bold">Settings</span><div></div></div>
  <div class="panel-layout">
    <aside class="panel-sidebar" id="sidebar"></aside>
    <main class="panel-main">
      <div class="top-bar hidden md:flex"><div><h1 class="text-lg font-bold text-gray-900">Settings</h1><p class="text-sm text-gray-500">Manage your account preferences</p></div></div>
      <div class="panel-content">
        <!-- Subscription -->
        <div class="card card-padded mb-6 animate-fadeInUp">
          <h3 class="text-sm font-semibold text-gray-900 mb-4">💎 Subscription Plan</h3>
          <div id="subscriptionInfo"></div>
        </div>

        <!-- Account Actions -->
        <div class="card card-padded animate-fadeInUp" style="animation-delay:.1s">
          <h3 class="text-sm font-semibold text-gray-900 mb-4">⚠️ Danger Zone</h3>
          <p class="text-sm text-gray-500 mb-4">Once you delete your account, there is no going back. Please be certain.</p>
          <button onclick="deleteAccount()" class="btn btn-danger btn-sm">Delete My Account</button>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/utils/api.js"></script>
  <script src="/js/utils/auth.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script>
    if (!Auth.requireAuth()) throw new Error();
    Sidebar.render('sidebar', 'settings');
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('show'); }

    const user = Auth.getUser();
    const sub = user?.subscription || {};
    const planColors = { free: 'bg-gray-100 text-gray-800', trial: 'bg-amber-100 text-amber-800', premium: 'bg-emerald-100 text-emerald-800' };

    document.getElementById('subscriptionInfo').innerHTML = `
      <div class="flex items-center gap-3 flex-wrap">
        <span class="badge ${planColors[sub.plan]||'bg-gray-100'} text-sm px-4 py-2">${(sub.plan||'free').toUpperCase()}</span>
        ${sub.endDate ? `<span class="text-sm text-gray-500">Expires: ${new Date(sub.endDate).toLocaleDateString()}</span>` : ''}
        ${sub.isActive ? '<span class="text-sm text-emerald-600 font-medium">✓ Active</span>' : '<span class="text-sm text-red-600 font-medium">✕ Inactive</span>'}
      </div>`;

    function deleteAccount() {
      Modal.confirm('Are you absolutely sure? This will permanently delete your account and all associated data.', async () => {
        try { await api.delete('/users/account'); Auth.clearAuth(); window.location.href = '/'; } catch(e) { Toast.error(e.message); }
      });
    }
  </script>
</body>
</html>
