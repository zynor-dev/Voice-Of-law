<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Voice of Law</title>
  <meta name="description" content="Create your Voice of Law account — Start your free trial">
  <script src="https://cdn.tailwindcss.com"></script>\n<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            vol: {
              main: '#13141f',
              sidebar: '#1a1b26',
              card: '#1f2029',
              hover: '#2a2b36',
              border: '#2f303d',
              gold: '#d4af37',
              goldHover: '#f2c94c',
              goldDark: '#a18321',
              text: '#f3f4f6',
              textMuted: '#9ca3af'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/custom.css">
  <style>.accent{color:#8b7355}.accent-bg{background-color:#8b7355}</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-50 to-white flex items-center justify-center p-4 font-sans">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <!-- Logo -->
      <div class="flex flex-col items-center mb-6">
        <a href="/">
          <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-gray-800 to-gray-900 flex items-center justify-center mb-3">
            <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg>
          </div>
        </a>
        <h1 class="text-2xl font-bold mb-1" style="color:#2c2c2c">Create Account</h1>
        <p class="text-sm text-gray-600">Join Voice of Law today</p>
      </div>

      <div id="errorBox" class="hidden bg-red-50 text-red-700 p-4 rounded-lg mb-4 border-l-4 border-red-700 text-sm"></div>

      <form id="registerForm" class="space-y-4">
        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">Full Name *</label><input name="fullName" required placeholder="Your full name" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 text-sm" style="--tw-ring-color:#8b7355"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">Email *</label><input type="email" name="email" required placeholder="your@email.com" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 text-sm" style="--tw-ring-color:#8b7355"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">Password *</label><input type="password" name="password" required minlength="6" placeholder="Min 6 characters" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 text-sm" style="--tw-ring-color:#8b7355"></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-sm font-medium text-gray-700 mb-1.5">City *</label><input name="city" required placeholder="e.g. Lahore" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 text-sm" style="--tw-ring-color:#8b7355"></div>
          <div><label class="block text-sm font-medium text-gray-700 mb-1.5">Court Name *</label><input name="courtName" required placeholder="e.g. Lahore HC" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 text-sm" style="--tw-ring-color:#8b7355"></div>
        </div>

        <button type="submit" id="submitBtn" class="w-full py-3 text-white rounded-lg font-medium transition text-sm hover:opacity-90" style="background-color:#2c2c2c">
          Create New Account
        </button>
      </form>

      <!-- Trial Info -->
      <div class="mt-5 p-4 rounded-lg" style="background-color:#8b73551a; border:1px solid #8b735533">
        <div class="flex items-start gap-3">
          <div class="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-sm accent-bg">✓</div>
          <div>
            <div class="text-sm font-medium mb-1" style="color:#2c2c2c">7-Day Free Trial Included</div>
            <p class="text-xs accent">Start your free trial today. No credit card required.</p>
          </div>
        </div>
      </div>

      <div class="mt-5 text-center"><p class="text-sm text-gray-600">Already have an account? <a href="/login" class="font-medium accent">Login</a></p></div>
      <div class="mt-4 text-center"><p class="text-xs text-gray-500">By continuing, you agree to our <a href="#" class="accent">Terms</a> and <a href="#" class="accent">Privacy Policy</a></p></div>
    </div>
  </div>

  <script src="/js/utils/api.js"></script>
  <script src="/js/utils/auth.js"></script>
  <script src="/js/components/toast.js"></script>
  <script>
    if (Auth.isLoggedIn()) window.location.href = '/dashboard';

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      errorBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<div class="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin mx-auto"></div>';

      try {
        const fd = new FormData(e.target);
        const res = await api.post('/auth/register', {
          fullName: fd.get('fullName'),
          email: fd.get('email'),
          password: fd.get('password'),
          city: fd.get('city'),
          courtName: fd.get('courtName')
        });
        Auth.setAuth(res.token, res.user);
        Toast.success('🎉 Welcome! Your free trial has started!');
        setTimeout(() => window.location.href = '/dashboard', 1500);
      } catch (error) {
        errorBox.textContent = error.message || 'Registration failed.';
        errorBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Create New Account';
      }
    });
  </script>
</body>
</html>
