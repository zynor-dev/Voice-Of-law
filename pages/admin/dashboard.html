<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Voice of Law</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/custom.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            vol: {
              main: '#13141f',
              sidebar: '#1a1b26',
              card: '#1f2029',
              hover: '#2a2b36',
              border: '#2f303d',
              gold: '#d4af37',
              goldHover: '#f2c94c',
              goldDark: '#a18321',
              text: '#f3f4f6',
              textMuted: '#9ca3af'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 font-sans">
  <div class="panel-layout">
    <!-- Admin Sidebar -->
    <aside class="panel-sidebar" id="sidebar">
      <div class="flex flex-col h-full bg-gray-900 text-white">
        <div class="flex items-center gap-3 px-5 py-5 border-b border-gray-800">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg>
          </div>
          <div><span class="text-sm font-bold">Voice of Law</span><p class="text-[10px] text-gray-400">Admin Panel</p></div>
        </div>
        <nav class="flex-1 px-3 py-4 space-y-1">
          <a href="/admin" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-white/10 text-white">📊 Dashboard</a>
          <a href="/admin/users" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-white/5 hover:text-white">👥 Users</a>
          <a href="/admin/library" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-white/5 hover:text-white">📚 Library</a>
          <a href="/admin/templates" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-white/5 hover:text-white">📝 Templates</a>
          <a href="/admin/announcements" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-white/5 hover:text-white">📢 Announcements</a>
          <a href="/dashboard" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-white/5 hover:text-white mt-4 border-t border-gray-800 pt-4">🏠 User Panel</a>
        </nav>
        <div class="px-3 py-4 border-t border-gray-800">
          <button onclick="Auth.logout()" class="flex items-center gap-2 w-full px-3 py-2 text-sm text-red-400 hover:bg-red-500/10 rounded-lg">🚪 Logout</button>
        </div>
      </div>
    </aside>

    <main class="panel-main">
      <div class="top-bar"><div><h1 class="text-lg font-bold text-gray-900">Admin Dashboard</h1><p class="text-sm text-gray-500">System overview and management</p></div></div>
      <div class="panel-content">
        <!-- Stats -->
        <div id="statsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 stagger-children"></div>

        <!-- Recent Users -->
        <div class="card animate-fadeInUp" style="animation-delay:.3s">
          <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
            <h2 class="text-sm font-semibold text-gray-900">Recent Users</h2>
            <a href="/admin/users" class="text-xs text-indigo-600 font-medium">View All →</a>
          </div>
          <div class="overflow-x-auto">
            <table class="data-table">
              <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead>
              <tbody id="recentUsers"></tbody>
            </table>
          </div>
        </div>

        <!-- Audit Logs -->
        <div class="card mt-6 animate-fadeInUp" style="animation-delay:.35s">
          <div class="px-6 py-4 border-b border-gray-100"><h2 class="text-sm font-semibold text-gray-900">Recent Activity</h2></div>
          <div id="auditLogs" class="px-6 py-4"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/utils/api.js"></script>
  <script src="/js/utils/auth.js"></script>
  <script src="/js/components/toast.js"></script>
  <script>
    if (!Auth.requireAuth() || !Auth.requireAdmin()) throw new Error();

    async function loadDashboard() {
      try {
        const res = await api.get('/admin/dashboard');
        const { stats, recentUsers } = res;

        const cards = [
          { label: 'Total Users', value: stats.totalUsers, from: '#3b82f6', to: '#2563eb', icon: '👥' },
          { label: 'Total Cases', value: stats.totalCases, from: '#8b5cf6', to: '#7c3aed', icon: '📋' },
          { label: 'Library Books', value: stats.totalBooks, from: '#10b981', to: '#059669', icon: '📚' },
          { label: 'Templates', value: stats.totalTemplates, from: '#f59e0b', to: '#d97706', icon: '📝' },
        ];

        document.getElementById('statsGrid').innerHTML = cards.map(s => `
          <div class="stat-card animate-fadeInUp" style="--stat-from:${s.from};--stat-to:${s.to}">
            <div class="flex items-center justify-between"><div><p class="text-xs font-medium opacity-80">${s.label}</p><p class="text-2xl font-bold mt-1">${s.value||0}</p></div><span class="text-2xl">${s.icon}</span></div>
          </div>`).join('');

        document.getElementById('recentUsers').innerHTML = (recentUsers || []).map(u => `
          <tr><td class="font-medium">${u.fullName}</td><td class="text-gray-500">${u.email}</td><td><span class="badge ${u.role==='admin'?'badge-danger':'badge-info'}">${u.role}</span></td><td class="text-gray-400 text-xs">${new Date(u.createdAt).toLocaleDateString()}</td></tr>`).join('');
      } catch(e) { Toast.error('Failed to load dashboard'); }
    }

    async function loadAuditLogs() {
      try {
        const res = await api.get('/admin/audit-logs?limit=10');
        const logs = res.data || [];
        document.getElementById('auditLogs').innerHTML = logs.length ? logs.map(l => `
          <div class="flex items-center gap-3 py-2 border-b border-gray-50 last:border-0">
            <span class="badge badge-${l.action==='delete'?'danger':l.action==='create'?'success':l.action==='login'?'info':'purple'}">${l.action}</span>
            <div class="flex-1"><p class="text-xs text-gray-700">${l.userId?.fullName||'System'} • ${l.entity}</p>${l.details ? `<p class="text-[10px] text-gray-400">${l.details}</p>`:''}</div>
            <span class="text-[10px] text-gray-400">${new Date(l.createdAt).toLocaleString()}</span>
          </div>`).join('') : '<p class="text-xs text-gray-400">No recent activity</p>';
      } catch(e) {}
    }

    loadDashboard();
    loadAuditLogs();
  </script>
</body>
</html>
