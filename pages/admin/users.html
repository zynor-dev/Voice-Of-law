<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management — Voice of Law Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/custom.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            vol: {
              main: '#13141f',
              sidebar: '#1a1b26',
              card: '#1f2029',
              hover: '#2a2b36',
              border: '#2f303d',
              gold: '#d4af37',
              goldHover: '#f2c94c',
              goldDark: '#a18321',
              text: '#f3f4f6',
              textMuted: '#9ca3af'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 font-sans">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="top-bar md:hidden"><button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-100"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button><span class="text-sm font-bold">Manage Users</span><div></div></div>
  <div class="panel-layout">
    <!-- Admin Sidebar -->
    <aside class="panel-sidebar" id="sidebar">
      <div class="flex flex-col h-full bg-gray-900 text-white">
        <div class="flex items-center gap-3 px-5 py-5 border-b border-gray-800">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg>
          </div>
          <div><span class="text-sm font-bold">Voice of Law</span><p class="text-[10px] text-gray-400">Admin Panel</p></div>
        </div>
        <nav class="flex-1 px-3 py-4 space-y-1">
          <a href="/admin" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-white/5 hover:text-white">📊 Dashboard</a>
          <a href="/admin/users" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-white/10 text-white">👥 Users</a>
          <a href="/admin/library" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-white/5 hover:text-white">📚 Library</a>
          <a href="/admin/templates" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-white/5 hover:text-white">📝 Templates</a>
          <a href="/admin/announcements" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-white/5 hover:text-white">📢 Announcements</a>
          <a href="/dashboard" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-white/5 hover:text-white mt-4 border-t border-gray-800 pt-4">🏠 User Panel</a>
        </nav>
        <div class="px-3 py-4 border-t border-gray-800">
          <button onclick="Auth.logout()" class="flex items-center gap-2 w-full px-3 py-2 text-sm text-red-400 hover:bg-red-500/10 rounded-lg">🚪 Logout</button>
        </div>
      </div>
    </aside>

    <main class="panel-main">
      <div class="top-bar hidden md:flex"><div><h1 class="text-lg font-bold text-gray-900">User Management</h1><p class="text-sm text-gray-500">Manage all registered users</p></div></div>
      <div class="panel-content">
        <!-- Filters -->
        <div class="card card-padded mb-6 animate-fadeInUp">
          <div class="flex flex-wrap items-center gap-3">
            <input type="text" id="searchInput" class="form-input flex-1 min-w-[200px]" placeholder="Search by name or email..." oninput="debounceSearch()">
            <select id="roleFilter" class="form-input w-auto" onchange="loadUsers()">
              <option value="">All Roles</option>
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>

        <!-- Users Table -->
        <div class="card animate-fadeInUp" style="animation-delay:.1s">
          <div class="overflow-x-auto">
            <table class="data-table">
              <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Plan</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
              <tbody id="usersList"></tbody>
            </table>
          </div>
        </div>
        <div id="pagination" class="flex items-center justify-between mt-4"></div>
      </div>
    </main>
  </div>

  <script src="/js/utils/api.js"></script>
  <script src="/js/utils/auth.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/loader.js"></script>
  <script>
    if (!Auth.requireAuth() || !Auth.requireAdmin()) throw new Error();
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('show'); }

    let currentPage = 1, searchTimeout;
    function debounceSearch() { clearTimeout(searchTimeout); searchTimeout = setTimeout(() => { currentPage = 1; loadUsers(); }, 400); }

    const roleBadge = { user: 'badge-info', admin: 'badge-purple' };

    async function loadUsers() {
      const container = document.getElementById('usersList');
      container.innerHTML = `<tr><td colspan="7">${Loader.show()}</td></tr>`;
      
      try {
        let url = `/admin/users?page=${currentPage}&limit=15`;
        const search = document.getElementById('searchInput').value;
        const role = document.getElementById('roleFilter').value;
        if (search) url += `&search=${encodeURIComponent(search)}`;
        if (role) url += `&role=${role}`;

        const res = await api.get(url);
        const { data: users, pagination } = res;

        if (!users.length) {
          container.innerHTML = '<tr><td colspan="7" class="text-center py-6 text-gray-500">No users found</td></tr>';
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        container.innerHTML = users.map(u => `
          <tr>
            <td class="font-medium">${u.fullName}</td>
            <td class="text-gray-500 text-sm">${u.email}</td>
            <td><span class="badge ${roleBadge[u.role]||'bg-gray-100'}">${u.role}</span></td>
            <td><span class="badge ${u.subscription?.plan==='premium'?'badge-success':'badge-warning'}">${u.subscription?.plan||'free'}</span></td>
            <td><span class="badge ${u.isActive?'badge-success':'badge-danger'}">${u.isActive?'Active':'Inactive'}</span></td>
            <td class="text-gray-400 text-xs">${new Date(u.createdAt).toLocaleDateString()}</td>
            <td>
              <div class="flex gap-2">
                <button onclick="toggleUserStatus('${u._id}', ${!u.isActive})" class="btn btn-sm ${u.isActive?'btn-danger':'btn-success'}">${u.isActive?'Deactivate':'Activate'}</button>
              </div>
            </td>
          </tr>
        `).join('');

        // Pagination
        const p = pagination;
        if (p.pages > 1) {
          document.getElementById('pagination').innerHTML = `
            <p class="text-xs text-gray-500">Showing page ${p.page} of ${p.pages} (${p.total} total)</p>
            <div class="flex items-center gap-2">
              <button class="btn btn-secondary btn-sm" ${p.page <= 1 ? 'disabled':''} onclick="goToPage(${p.page-1})">← Prev</button>
              <button class="btn btn-secondary btn-sm" ${!p.hasMore ? 'disabled':''} onclick="goToPage(${p.page+1})">Next →</button>
            </div>`;
        } else { document.getElementById('pagination').innerHTML = ''; }
      } catch (err) {
        container.innerHTML = '<tr><td colspan="7" class="text-center py-6 text-red-500">Failed to load users</td></tr>';
      }
    }

    function goToPage(p) { currentPage = p; loadUsers(); }

    async function toggleUserStatus(id, newStatus) {
      Modal.confirm(`Are you sure you want to ${newStatus?'activate':'deactivate'} this user?`, async () => {
        try {
          await api.patch(`/admin/users/${id}/status`, { isActive: newStatus });
          Toast.success(`User ${newStatus?'activated':'deactivated'} successfully`);
          loadUsers();
        } catch(e) { Toast.error(e.message); }
      });
    }

    loadUsers();
  </script>
</body>
</html>
